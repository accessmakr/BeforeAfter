name: Build BeforeAfter (.aab + .ipa)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: beforeafter-android-release
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Generate iOS project files
        run: flutter create . --platforms=ios --org=com.beforeafter
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../ios/ipa/BeforeAfter-release.ipa Payload
          cd ../../..
      - uses: actions/upload-artifact@v4
        with:
          name: beforeafter-ios-unsigned
          path: build/ios/ipa/*.ipa
          retention-days: 30
