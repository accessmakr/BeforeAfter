name: Build BeforeAfter (.aab + .ipa + Web to Cloudflare)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  # ─── WEB BUILD → Cloudflare Pages ───
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --base-href /

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=beforeafter --branch=main

  # ─── ANDROID .aab ───
  build-android-aab:
    runs-on: ubuntu-latest
    needs: build-and-deploy-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: beforeafter-android-release
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # ─── iOS .ipa (unsigned) ───
  build-ios-ipa:
    runs-on: macos-latest
    needs: build-and-deploy-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../ios/ipa/BeforeAfter-release.ipa Payload
          cd ../../..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: beforeafter-ios-unsigned
          path: build/ios/ipa/*.ipa
          retention-days: 30
