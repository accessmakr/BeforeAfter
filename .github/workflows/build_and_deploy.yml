name: Build BeforeAfter (.aab + .apk + .ipa)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter create . --platforms=android --org=com.beforeafter --project-name=beforeafter
      - run: rm -f android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter build appbundle --release --split-debug-info=symbols --obfuscate
      - run: flutter build apk --release --split-debug-info=symbols --obfuscate
      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: beforeafter-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Upload APK (for phone testing)
        uses: actions/upload-artifact@v4
        with:
          name: beforeafter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios-ipa:
    runs-on: macos-latest
    env:
      FLUTTER_SWIFT_PACKAGE_MANAGER: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=ios --org=com.beforeafter --project-name=beforeafter
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../ios/ipa/BeforeAfter-release.ipa Payload
          cd ../../..
      - uses: actions/upload-artifact@v4
        with:
          name: beforeafter-ios-unsigned
          path: build/ios/ipa/*.ipa
          retention-days: 30
