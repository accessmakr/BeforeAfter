name: beforeafter
description: Before & After photo comparison with interactive slider
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  image_gallery_saver: ^2.0.3
  in_app_purchase: ^3.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
